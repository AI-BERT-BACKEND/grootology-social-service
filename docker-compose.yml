services:
  postgres:
    image: postgres:16-alpine
    container_name: social-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - social_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: social-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      DB_NAME: ${DB_NAME}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_BASE_URL: ${APP_BASE_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://frontend-umber-seven-28.vercel.app,http://localhost:3000,http://localhost:5173}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL:-https://aibert-profile-service-qa.yellowwave-cb2d91fc.centralus.azurecontainerapps.io}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  social_db_data:
